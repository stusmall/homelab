apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrocd-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
spec:
  ingressClassName: cilium
  rules:
    - http:
        paths:
          - backend:
              service:
                name: argocd-server
                port:
                  number: 443
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - argocd.stuartsmall.com
      secretName: argocd-cert
