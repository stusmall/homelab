apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/argoproj/argo-helm/argo-cd
    chart: argo-cd
    targetRevision: 10.0.0
    helm:
      valuesObject:
        global:
          image:
            repository: reg.mini.dev/argocd
        dex:
          image:
            repository: reg.mini.dev/redis
        redis:
          image:
            repository: reg.mini.dev/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
