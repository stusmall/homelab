apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://helm.mini.dev/argo-cd
    chart: argocd
    targetRevision: 10.2.0
    helm:
      values: |
        argo-cd:
          configs:
            params:
              server.insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
