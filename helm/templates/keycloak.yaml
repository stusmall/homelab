apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://helm.mini.dev/keycloak-advanced
    chart: keycloak-advanced
    targetRevision: 25.2.0
    helm:
      values: |
        keycloak:
          extraEnv:
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
